<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>[App Name]</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 font-sans">

<header class="p-4 flex items-center justify-between max-w-2xl mx-auto">
  <h1 class="text-2xl font-extrabold text-slate-700">[App Name]</h1>
  <div class="flex items-center gap-2">
    <span id="score" class="bg-white rounded-full px-4 py-1 font-bold shadow">⭐ 0</span>
  </div>
</header>

<main class="max-w-2xl mx-auto px-4 pb-10">

  <!-- Age group -->
  <section id="ageScreen" class="bg-white rounded-3xl shadow-lg p-6">
    <h2 class="text-xl font-bold mb-4 text-center">Who is playing?</h2>
    <div class="grid gap-3">
      <button data-age="kids" class="text-left rounded-2xl px-5 py-4 bg-slate-200 hover:bg-slate-300">
        <span class="font-bold block">Kids (8–15)</span>
        <span class="text-sm text-slate-600">Everyday and school words</span>
      </button>
      <button data-age="youth" class="text-left rounded-2xl px-5 py-4 bg-slate-200 hover:bg-slate-300">
        <span class="font-bold block">Youth (16+)</span>
        <span class="text-sm text-slate-600">Academic and advanced words</span>
      </button>
    </div>
  </section>

  <!-- Level select -->
  <section id="levelScreen" class="hidden bg-white rounded-3xl shadow-lg p-6">
    <div class="flex justify-between items-center mb-4">
      <button id="ageBackBtn" class="underline text-slate-500">← Age group</button>
      <span id="ageLabel" class="text-slate-500 font-semibold"></span>
    </div>
    <h2 class="text-xl font-bold mb-4 text-center">Choose a level</h2>
    <div id="levelButtons" class="grid gap-3"></div>

    <div class="mt-6 border-t pt-4">
      <h3 class="font-bold mb-2">Watch and learn</h3>
      <ul id="watchList" class="space-y-2 text-sm"></ul>
    </div>
  </section>

  <!-- Game -->
  <section id="gameScreen" class="hidden bg-white rounded-3xl shadow-lg p-6 text-center">
    <div class="flex justify-between items-center text-slate-500 font-semibold">
      <button id="backBtn" class="underline">← Levels</button>
      <span id="levelLabel"></span>
    </div>

    <div id="videoBox" class="my-4"></div>

    <div id="picture" class="text-8xl my-4 select-none"></div>

    <p id="prompt" class="text-lg font-semibold mb-3"></p>

    <div id="letters" class="flex justify-center gap-2 flex-wrap mb-4"></div>

    <input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
      class="w-full max-w-md border-4 border-slate-300 focus:border-slate-500 rounded-2xl px-4 py-3 text-xl text-center outline-none"
      placeholder="Type here…">

    <p id="feedback" class="h-6 mt-3 font-bold"></p>

    <div class="flex justify-center gap-3 mt-4">
      <button id="listen" class="bg-amber-300 hover:bg-amber-400 rounded-2xl px-5 py-3 font-bold">🔊 Hear it</button>
      <button id="check" class="bg-slate-700 hover:bg-slate-800 text-white rounded-2xl px-6 py-3 font-bold">Check ✔</button>
    </div>

    <div id="progress" class="mt-6 flex gap-2 justify-center flex-wrap"></div>
  </section>

  <!-- Level complete -->
  <section id="doneScreen" class="hidden bg-white rounded-3xl shadow-lg p-8 text-center">
    <div class="text-6xl mb-3">🎉</div>
    <h2 class="text-2xl font-bold mb-2">Level complete!</h2>
    <p class="text-slate-500 mb-5" id="doneText"></p>
    <div class="flex justify-center gap-3">
      <button id="nextLevelBtn" class="bg-slate-700 text-white rounded-2xl px-6 py-3 font-bold">Next level</button>
      <button id="replayBtn" class="bg-amber-300 rounded-2xl px-6 py-3 font-bold">Play again</button>
    </div>
  </section>
</main>

<script>
const CONTENT = {
  kids: {
    label: "Kids (8–15)",
    levels: [
      { name: "Level 1: Short words", words: [
        { word: "cat",   picture: "🐱", sentence: "The cat is sleeping." },
        { word: "dog",   picture: "🐶", sentence: "The dog likes to run." },
        { word: "sun",   picture: "☀️", sentence: "The sun is bright today." },
        { word: "bed",   picture: "🛏️", sentence: "I sleep in my bed." },
        { word: "cup",   picture: "🥛", sentence: "I drink milk from a cup." }
      ]},
      { name: "Level 2: School words", words: [
        { word: "book",     picture: "📖", sentence: "I read a book in class." },
        { word: "pencil",   picture: "✏️", sentence: "I write my homework with a pencil." },
        { word: "bag",      picture: "🎒", sentence: "My school bag is heavy." },
        { word: "teacher",  picture: "🧑‍🏫", sentence: "My teacher helps me with English." },
        { word: "football", picture: "⚽", sentence: "We play football after school." }
      ]},
      { name: "Level 3: Longer words", words: [
        { word: "rabbit",  picture: "🐰", sentence: "The rabbit hops in the garden." },
        { word: "banana",  picture: "🍌", sentence: "I like to eat a banana for breakfast." },
        { word: "window",  picture: "🪟", sentence: "Please open the window." },
        { word: "library", picture: "🏛️", sentence: "We borrow books from the library." },
        { word: "flower",  picture: "🌸", sentence: "The flower smells sweet." }
      ]}
    ],
    watch: [
      { title: "Learn English Kids (British Council)", note: "Games, songs and stories for young learners", q: "Learn English Kids British Council" },
      { title: "Peppa Pig (Official Channel)", note: "Short episodes with everyday vocabulary", q: "Peppa Pig official channel English" },
      { title: "Blippi", note: "Learn about the world with new words", q: "Blippi official channel" }
    ]
  },
  youth: {
    label: "Youth (16+)",
    levels: [
      { name: "Level 1: Everyday English", words: [
        { word: "backpack",  picture: "🎒", sentence: "She packed her laptop in her backpack before leaving." },
        { word: "schedule",  picture: "📅", sentence: "My schedule changes every week." },
        { word: "keyboard",  picture: "⌨️", sentence: "He types quickly on the keyboard." },
        { word: "headphones",picture: "🎧", sentence: "I listen to music with my headphones on the bus." },
        { word: "coffee",    picture: "☕", sentence: "I need a coffee before my first class." }
      ]},
      { name: "Level 2: Academic words", words: [
        { word: "microscope", picture: "🔬", sentence: "Students observed the cells under a microscope." },
        { word: "globe",      picture: "🌍", sentence: "The globe shows where each country is located." },
        { word: "calculate",  picture: "🧮", sentence: "Please calculate the total cost of the project." },
        { word: "research",   picture: "📚", sentence: "Her research focuses on climate change." },
        { word: "analysis",   picture: "📊", sentence: "The analysis of the sales data took two days." }
      ]},
      { name: "Level 3: Advanced words", words: [
        { word: "adventure",   picture: "🧭", sentence: "Traveling alone was a real adventure for me." },
        { word: "ambition",    picture: "🏔️", sentence: "Her ambition is to start her own company." },
        { word: "creative",    picture: "🎨", sentence: "Creative thinking helps solve difficult problems." },
        { word: "community",   picture: "🤝", sentence: "Our community works together to clean the river." },
        { word: "knowledge",   picture: "💡", sentence: "Knowledge grows when you share it with others." }
      ]}
    ],
    watch: [
      { title: "English with subtitles on TED-Ed", note: "Short lessons on ideas and vocabulary", q: "TED-Ed English vocabulary lesson" },
      { title: "British Council LearnEnglish", note: "Video lessons for adult learners", q: "British Council LearnEnglish video vocabulary" },
      { title: "Vlad and Niki (official)", note: "Easy English for younger learners and families", q: "Vlad and Niki official English" }
    ]
  }
};

/* YouTube video IDs per level (the part after ?v= in the video link). Leave "" to show "Video coming soon". */
const VIDEOS = {
  kids:  ["r4epifto6T8", "HvfEApGxQdw", "xYw9v3cSlmQ"],
  youth: ["", "", ""]
};

let ageKey = null, unlocked = 1, level = 0, wordIdx = 0, step = 1, typed = "", score = 0, voice = null;
const el = id => document.getElementById(id);
const norm = s => s.toLowerCase().replace(/[^a-z ]/g, "").replace(/\s+/g, " ").trim();
const curLevels = () => CONTENT[ageKey].levels;

/* ---------- Voice ---------- */
function pickVoice() {
  const voices = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith("en"));
  return voices.find(v => /Google US English|Samantha|Microsoft Zira|Microsoft Aria/i.test(v.name))
      || voices.find(v => v.lang === "en-US")
      || voices[0] || null;
}
function speak(text, slow = true) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = slow ? 0.75 : 0.9;
  if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}
if ("speechSynthesis" in window) {
  voice = pickVoice();
  speechSynthesis.onvoiceschanged = () => { voice = pickVoice(); };
}

/* ---------- Screens ---------- */
function showScreen(id) {
  ["ageScreen", "levelScreen", "gameScreen", "doneScreen"].forEach(s => el(s).classList.add("hidden"));
  el(id).classList.remove("hidden");
}

function renderAge() {
  el("score").textContent = "⭐ " + score;
  showScreen("ageScreen");
}

function renderLevels() {
  unlocked = Math.max(unlocked, 1);
  el("ageLabel").textContent = CONTENT[ageKey].label;
  el("levelButtons").innerHTML = curLevels().map((lv, i) => {
    const open = i < unlocked;
    return `<button ${open ? "" : "disabled"} data-level="${i}"
      class="text-left rounded-2xl px-5 py-4 font-bold ${open ? "bg-slate-200 hover:bg-slate-300" : "bg-slate-100 text-slate-400 cursor-not-allowed"}">
      ${open ? "" : "🔒 "}${lv.name}</button>`;
  }).join("");
  el("watchList").innerHTML = CONTENT[ageKey].watch.map(v =>
    `<li><a class="text-slate-700 underline" target="_blank" rel="noopener"
      href="https://www.youtube.com/results?search_query=${encodeURIComponent(v.q)}">${v.title}</a>
      <span class="text-slate-500">: ${v.note}</span></li>`
  ).join("");
  showScreen("levelScreen");
}

function startLevel(i) {
  level = i; wordIdx = 0; step = 1;
  showScreen("gameScreen");
  renderWord();
}

function renderWord() {
  const w = curLevels()[level].words[wordIdx];
  typed = "";
  el("levelLabel").textContent = curLevels()[level].name;
  el("picture").textContent = w.picture;
  setVideo();
  el("prompt").textContent = step === 1 ? "Type the word for this picture" : "Now type a sentence with the word";
  el("answer").value = "";
  el("answer").placeholder = step === 1 ? "Type the word…" : "Type the sentence…";
  el("feedback").textContent = "";
  el("answer").focus();
  renderLetters();
  renderProgress();
  speak(w.word);
}

function renderLetters() {
  const w = curLevels()[level].words[wordIdx];
  const box = el("letters");
  box.innerHTML = "";
  if (step === 1) {
    for (let i = 0; i < w.word.length; i++) {
      const s = document.createElement("span");
      const filled = i < typed.length;
      s.className = "w-10 h-12 flex items-center justify-center rounded-xl text-2xl font-bold " +
        (filled ? "bg-slate-700 text-white" : "bg-slate-200 text-slate-400");
      s.textContent = filled ? typed[i] : w.word[i];
      box.appendChild(s);
    }
  } else {
    box.innerHTML = `<p class="text-slate-500">Type the full sentence</p>`;
  }
}

function renderProgress() {
  el("progress").innerHTML = curLevels()[level].words.map((_, i) =>
    `<span class="w-3 h-3 rounded-full ${i < wordIdx ? "bg-emerald-400" : i === wordIdx ? "bg-slate-600" : "bg-slate-300"}"></span>`
  ).join("");
}

function setVideo() {
  const id = (VIDEOS[ageKey] || [])[level];
  el("videoBox").innerHTML = id
    ? `<iframe class="w-full aspect-video rounded-2xl" src="https://www.youtube-nocookie.com/embed/${id}" title="Lesson video" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe>`
    : `<div class="w-full aspect-video rounded-2xl bg-slate-200 flex items-center justify-center text-slate-500">Video coming soon</div>`;
}

/* ---------- Checking ---------- */
function check() {
  const w = curLevels()[level].words[wordIdx];
  const target = norm(step === 1 ? w.word : w.sentence);
  const guess = norm(el("answer").value);
  const fb = el("feedback");

  if (guess === target) {
    fb.className = "h-6 mt-3 font-bold text-emerald-600";
    fb.textContent = "Great job! 🎉";
    score++;
    el("score").textContent = "⭐ " + score;
    setTimeout(advance, 900);
  } else {
    fb.className = "h-6 mt-3 font-bold text-rose-500";
    fb.textContent = "Almost! Try again.";
  }
}

function advance() {
  if (step === 1) { step = 2; renderWord(); return; }
  step = 1;
  wordIdx++;
  if (wordIdx >= curLevels()[level].words.length) return finishLevel();
  renderWord();
}

function finishLevel() {
  if (level + 1 >= unlocked && level + 1 < curLevels().length) unlocked = level + 2;
  el("doneText").textContent = `You finished ${curLevels()[level].name}.`;
  el("nextLevelBtn").classList.toggle("hidden", level + 1 >= curLevels().length);
  showScreen("doneScreen");
}

/* ---------- Events ---------- */
document.querySelectorAll("button[data-age]").forEach(b => b.addEventListener("click", () => {
  ageKey = b.dataset.age;
  unlocked = 1;
  renderLevels();
}));
el("ageBackBtn").addEventListener("click", renderAge);
el("levelButtons").addEventListener("click", e => {
  const b = e.target.closest("button[data-level]");
  if (b && !b.disabled) startLevel(Number(b.dataset.level));
});
el("backBtn").addEventListener("click", renderLevels);
el("replayBtn").addEventListener("click", () => startLevel(level));
el("nextLevelBtn").addEventListener("click", () => startLevel(level + 1));
el("answer").addEventListener("input", e => {
  if (step === 1) {
    typed = norm(e.target.value).replace(/ /g, "");
    renderLetters();
  }
});
el("answer").addEventListener("keydown", e => { if (e.key === "Enter") check(); });
el("check").addEventListener("click", check);
el("listen").addEventListener("click", () => {
  const w = curLevels()[level].words[wordIdx];
  speak(step === 1 ? w.word : w.sentence, true);
});

renderAge();
</script>
</body>
</html>
